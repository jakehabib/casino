# Local infrastructure for NOVA.
#   docker compose up -d            → Postgres + Redis for local development
#   docker compose --profile app up → also builds and runs the app container
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nova -d nova']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ['app']
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://nova:nova@postgres:5432/nova?schema=public&connection_limit=20
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-please-set-a-long-random-secret-in-production}
      ENABLE_DEV_TOOLS: 'false'
    ports:
      - '3000:3000'

volumes:
  pgdata:
  redisdata:
